services:
  - type: web
    name: student-task-manager-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        value: file:./prod.db
      - key: CLIENT_ORIGIN
        sync: false # set to your deployed Vercel URL, e.g. https://student-task-manager.vercel.app
      - key: LOG_LEVEL
        value: info
